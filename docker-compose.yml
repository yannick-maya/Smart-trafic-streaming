name: lome-smart-traffic

services:
  kafka:
    image: ${KAFKA_IMAGE:?Copy .env.example to .env first}
    hostname: kafka
    restart: unless-stopped
    mem_limit: 900m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_LOG_RETENTION_MS: ${KAFKA_TOPIC_RETENTION_MS:-604800000}
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - ./.docker-data/kafka:/var/lib/kafka/data
    networks:
      - traffic
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s

  nifi:
    image: ${NIFI_IMAGE:?Copy .env.example to .env first}
    hostname: nifi
    restart: unless-stopped
    mem_limit: 2200m
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_WEB_PROXY_HOST: localhost:${NIFI_HTTPS_PORT:-8443}
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:?Set NIFI_USERNAME in .env}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:?Set NIFI_PASSWORD in .env}
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1200m
    ports:
      - "127.0.0.1:${NIFI_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./.docker-data/nifi/conf:/opt/nifi/nifi-current/conf
      - ./.docker-data/nifi/state:/opt/nifi/nifi-current/state
      - ./.docker-data/nifi/database:/opt/nifi/nifi-current/database_repository
      - ./.docker-data/nifi/flowfile:/opt/nifi/nifi-current/flowfile_repository
      - ./.docker-data/nifi/content:/opt/nifi/nifi-current/content_repository
      - ./.docker-data/nifi/provenance:/opt/nifi/nifi-current/provenance_repository
    networks:
      - traffic
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:8443/nifi-api/access/config >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  minio:
    image: ${MINIO_IMAGE:?Copy .env.example to .env first}
    hostname: minio
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./.docker-data/minio:/data
    networks:
      - traffic
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio-bootstrap:
    image: ${MINIO_MC_IMAGE:?Copy .env.example to .env first}
    profiles: ["bootstrap"]
    restart: "no"
    mem_limit: 128m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    networks:
      - traffic
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mc", "--version"]
      interval: 1m
      timeout: 5s
      retries: 1

  postgres:
    image: ${POSTGIS_IMAGE:?Copy .env.example to .env first}
    hostname: postgres
    restart: unless-stopped
    mem_limit: 900m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    networks:
      - traffic
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    image: ${GRAFANA_IMAGE:?Copy .env.example to .env first}
    hostname: grafana
    restart: unless-stopped
    mem_limit: 384m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./.docker-data/grafana:/var/lib/grafana
    networks:
      - traffic
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: ${KAFKA_UI_IMAGE:?Copy .env.example to .env first}
    profiles: ["tools"]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KAFKA_CLUSTERS_0_NAME: lome-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    networks:
      - traffic
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  traffic:
    driver: bridge
